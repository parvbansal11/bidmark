services:
  - type: web
    name: bidmark-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: Bidmark
      - key: MOCK_GOVERNMENT_API
        value: "true"
      - key: AI_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: "https://bidmark.vercel.app,http://localhost:5173"
    # The free plan has no persistent disk. start.sh reseeds on every boot, so the
    # demo always opens on the same data; attach a disk at /app/data to keep changes.
