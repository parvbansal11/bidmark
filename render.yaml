services:
  - type: web
    name: bidmark-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: Bidmark
      - key: MOCK_GOVERNMENT_API
        value: "true"
      - key: AI_PROVIDER
        value: deterministic
      # Only the public web origins that may call the API. Set to the Vercel production URL.
      - key: CORS_ORIGINS
        value: "http://localhost:5173"
      # Empty turns off public self-registration of staff accounts; admins issue them.
      - key: PRIVILEGED_ROLE_EMAIL_DOMAIN
        value: ""
      - key: SEED_ON_BOOT
        value: "false"
    # The free plan has no persistent disk. start.sh reseeds on every boot, so the
    # demo always opens on the same data; attach a disk at /app/data to keep changes.
